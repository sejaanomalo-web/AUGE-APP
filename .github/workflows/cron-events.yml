name: cron events

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: cron-events
  cancel-in-progress: false

jobs:
  fire:
    runs-on: ubuntu-latest
    steps:
      - name: Hit /api/cron/events
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ENDPOINT: ${{ vars.CRON_BASE_URL || 'https://auge-app.vercel.app' }}/api/cron/events
        run: |
          curl -fsSL --retry 3 --retry-delay 10 --max-time 60 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${ENDPOINT}"
